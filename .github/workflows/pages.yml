# Builds the Jekyll site and publishes it to GitHub Pages.
# Runs on every push to main. Pull requests are built (to catch errors)
# but never deployed.
#
# One-time setup: in the repository's Settings > Pages, set
# "Build and deployment > Source" to "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read     # deploy-pages reads the uploaded artifact
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that is in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        # base_path is "" on a custom domain, or "/<repo>" on <user>.github.io/<repo>
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
