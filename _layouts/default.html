<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.url == "/" %}
  <title>{{ site.title }} - Home</title>
  {%- else %}
  <title>{{ site.title }} - {{ page.title }}</title>
  {%- endif %}
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/site/tanx-logo-full.png' | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/site/tanx-badge.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Lato:wght@300;400&family=Montserrat:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="page-{{ page.slug | default: page.name | replace: '.md', '' | replace: '.html', '' }}">
  {% include header.html %}

  {% if page.banner %}{% include banner.html banner=page.banner %}{% endif %}

  <main id="main-wrap" class="content">
    {{ content }}
  </main>

  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
